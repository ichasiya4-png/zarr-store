<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE YIELD</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; padding: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #3498db; border: none; color: white; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #hasil { margin-top: 20px; text-align: center; font-size: 1.3em; color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

    <h2>CORE YIELD</h2>
    <input type="number" id="modal" placeholder="Modal Awal (Tanpa titik, misal: 25000)">
    <input type="number" id="profit" placeholder="Profit per Periode (%)">
    <input type="number" id="periode" placeholder="Jumlah Periode">
    <button onclick="hitung()">Hitung Hasil Akhir</button>

    <div id="hasil"></div>

    <audio id="myAudio" loop>
        <source src="ssstik.io_1781056629498.mp3" type="audio/mpeg">
    </audio>

    <script>
        function hitung() {
            let modal = parseFloat(document.getElementById('modal').value);
            let profit = parseFloat(document.getElementById('profit').value) / 100;
            let periode = parseInt(document.getElementById('periode').value);
            
            if (isNaN(modal) || isNaN(profit) || isNaN(periode)) {
                alert("Mohon isi semua kolom dengan angka yang benar!");
                return;
            }

            // Rumus Bunga Majemuk: A = P * (1 + r)^n
            let hasilAkhir = modal * Math.pow((1 + profit), periode);
            
            let hasilFormat = new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(hasilAkhir);

            document.getElementById('hasil').innerHTML = "Total Akhir: " + hasilFormat;
        }

        document.body.addEventListener('click', function() {
            document.getElementById("myAudio").play();
        }, { once: true });
    </script>
</body>
</html>
