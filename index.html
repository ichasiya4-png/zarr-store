<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE YIELD</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #3498db; border: none; color: white; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 20px;}
        #tabelSimulasi { width: 100%; margin-top: 20px; border-collapse: collapse; display: none; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
        h2 { text-align: center; color: #3498db; }
    </style>
</head>
<body>

    <h2>CORE YIELD</h2>
    <input type="number" id="modal" placeholder="Modal Awal (Rp)">
    <input type="number" id="profit" placeholder="Profit per Periode (%)">
    <input type="number" id="periode" placeholder="Jumlah Periode">
    <button onclick="hitung()">Hitung Hasil Akhir</button>
    <div id="hasil"></div>
    <table id="tabelSimulasi">
        <thead><tr><th>Periode</th><th>Modal Akhir</th></tr></thead>
        <tbody id="isiTabel"></tbody>
    </table>

    <audio id="myAudio" loop>
        <source src="ssstik.io_1781056629498.mp3" type="audio/mpeg">
    </audio>

    <script>
        function hitung() {
            let modal = parseFloat(document.getElementById('modal').value);
            let profit = parseFloat(document.getElementById('profit').value) / 100;
            let periode = parseInt(document.getElementById('periode').value);
            let isiTabel = document.getElementById('isiTabel');
            document.getElementById('tabelSimulasi').style.display = "table";
            isiTabel.innerHTML = "";
            let currentModal = modal;
            for (let i = 1; i <= periode; i++) {
                currentModal += (currentModal * profit);
                isiTabel.innerHTML += `<tr><td>${i}</td><td>Rp ${currentModal.toLocaleString('id-ID')}</td></tr>`;
            }
            document.getElementById('hasil').innerHTML = `<h3 style="text-align:center;">Total: Rp ${currentModal.toLocaleString('id-ID')}</h3>`;
        }
        document.body.addEventListener('click', function() {
            document.getElementById("myAudio").play();
        }, { once: true });
    </script>
</body>
</html>
