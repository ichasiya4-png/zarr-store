            font-weight: bold;

    <script>
        const nomorWA = "6281396568291"; 

        function kirimOrder(namaGame, idInput, nominalInput, payInput) {
            const idGame = document.getElementById(idInput).value;
            const nominal = document.getElementById(nominalInput).value;
            const pembayaran = document.getElementById(payInput).value;
            
            if(idGame == "") {
                alert("Isi data ID Game dulu, bro!");
                return;
            }
            
            const teks = `Halo ZARR STORE, Saya mau order!\n\n🎮 *Produk:* ${namaGame}\n🆔 *Tujuan/ID:* ${idGame}\n💎 *Nominal:* ${nominal}\n💳 *Metode Pembayaran:* ${pembayaran}\n\nMohon diproses ya min!`;
            const linkWA = `https://wa.me/${nomorWA}?text=${encodeURIComponent(teks)}`;
            window.open(linkWA, '_blank');
        }

        function kirimOrderCrypto() {
            const wallet = document.getElementById('id_crypto').value;
            const jaringan = document.getElementById('net_crypto').value;
            const nominal = document.getElementById('nominal_crypto').value;
            const pembayaran = document.getElementById('pay_crypto').value;
            
            if(wallet == "") {
                alert("Isi alamat wallet crypto dulu, bro!");
                return;
            }
            
            const teksCrypto = `Halo ZARR STORE, Saya mau beli Crypto!\n\n🪙 *Produk:* Crypto Asset\n🌐 *Jaringan/Network:* ${jaringan}\n📂 *Alamat Wallet:* ${wallet}\n💎 *Nominal:* ${nominal}\n💳 *Metode Pembayaran:* ${pembayaran}\n\nMohon segera diproses ya min!`;
            const linkWA = `https://wa.me/${nomorWA}?text=${encodeURIComponent(teksCrypto)}`;
            window.open(linkWA, '_blank');
        }

        // Fungsi khusus rekap e-wallet biar infonya detail ke WA lu
        function kirimOrderEwallet() {
            const noHp = document.getElementById('id_ewallet').value;
            const jenis = document.getElementById('jenis_ewallet').value;
            const nominal = document.getElementById('nominal_ewallet').value;
            const pembayaran = document.getElementById('pay_ewallet').value;
            
            if(noHp == "") {
                alert("Isi Nomor HP E-Wallet dulu, bro!");
                return;
