<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZARR COMP-CALC</title>
    <style>
        :root { --accent: #38bdf8; }
        body { background: #050505; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .card { background: #111; border-radius: 16px; padding: 25px; border: 1px solid var(--accent); width: 100%; max-width: 350px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .header { font-size: 1.1rem; font-weight: bold; color: var(--accent); margin-bottom: 20px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--accent); background: #000; color: #fff; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; color: #000; cursor: pointer; margin-top: 10px; }
        .result-box { margin-top: 25px; text-align: center; border-top: 1px solid #333; padding-top: 20px; }
        .value { font-size: 1.4rem; font-weight: bold; color: var(--accent); margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="ssstik.io_1781332515279.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <div class="header">KALKULATOR COMPOUNDING INTEREST ZARR</div>
        
        <input type="text" id="modal" placeholder="Modal Awal (Rp)" oninput="formatRupiah(this)" onfocus="clean(this)">
        <input type="text" id="persen" placeholder="Profit per Tahun (%)" oninput="formatRupiah(this)" onfocus="clean(this)">
        <input type="text" id="tahun" placeholder="Jumlah Tahun" oninput="formatRupiah(this)" onfocus="clean(this)">
        
        <button onclick="hitung()">HITUNG HASIL</button>

        <div class="result-box">
            <div style="color: #888; font-size: 0.8rem;">TOTAL ASET AKHIR</div>
            <div id="result" class="value">Rp 0</div>
        </div>
    </div>

    <script>
        function formatRupiah(el) {
            let val = el.value.replace(/[^0-9]/g, '');
            if (val) el.value = parseInt(val).toLocaleString('id-ID');
        }
        function clean(el) { el.value = el.value.replace(/\./g, ''); }

        function hitung() {
            // Jalankan musik saat tombol diklik
            let music = document.getElementById('bgMusic');
            music.play();

            let modal = parseFloat(document.getElementById('modal').value.replace(/\./g, ''));
            let persen = parseFloat(document.getElementById('persen').value.replace(/\./g, '')) / 100;
            let tahun = parseInt(document.getElementById('tahun').value.replace(/\./g, ''));
            
            if(isNaN(modal) || isNaN(persen) || isNaN(tahun)) return alert("Isi semua data!");

            let total = modal * Math.pow((1 + persen), tahun);

            document.getElementById('result').innerText = 
                "Rp " + Math.round(total).toLocaleString('id-ID');
        }
    </script>
</body>
</html>
